<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Validation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        form {
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type=text],
        select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input[type=submit] {
            width: 100%;
            background-color: green;
            color: white;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type=submit]:hover {
            background-color: darkgreen;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        #successPage {
            display: none;
            background-color: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px gray;
        }

        .country-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .country-card {
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            background-color: #fafafa;
            box-shadow: 0px 0px 5px lightgray;
        }

        .country-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .country-card h3 {
            padding-top: 10px;
        }

        .country-card p {
            padding-bottom: 15px;
            color: gray;
        }
    </style>

</head>

<body>

    <h2>HTML Form with Validation</h2>

    <form id="myForm">

        <label>First Name</label>
        <input type="text" id="fname" placeholder="Enter First Name">
        <span class="error" id="fnameError"></span>

        <label>Last Name</label>
        <input type="text" id="lname" placeholder="Enter Last Name">
        <span class="error" id="lnameError"></span>

        <label>Country</label>

        <select id="country">
            <option value="">Select Country</option>
            <option>Australia</option>
            <option>Canada</option>
            <option>USA</option>
            <option>India</option>
        </select>

        <span class="error" id="countryError"></span>

        <input type="submit" value="Submit">

    </form>

    <!-- Success Page -->

    <div id="successPage">

        <h1>Form Submitted Successfully!</h1>

        <h2>Beautiful Places in Different Countries</h2>

        <div class="country-container">

            <!-- Australia -->
            <div class="country-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/40/Sydney_Opera_House_Sails.jpg"
                    alt="Australia">
                <h3>Australia</h3>
                <p>Sydney Opera House</p>
            </div>

            <!-- Canada -->
            <div class="country-card">
                <img src="https://www.shutterstock.com/image-photo/ottawa-canada-october-3-2015-600nw-2157299357.jpg"
                    alt="Canada">
                <h3>Canada</h3>
                <p>Moraine Lake</p>
            </div>

            <!-- USA -->
            <div class="country-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Statue_of_Liberty_7.jpg"
                    alt="USA">
                <h3>USA</h3>
                <p>Statue of Liberty</p>
            </div>

            <!-- India -->
            <div class="country-card">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/da/Taj-Mahal.jpg"
                    alt="India">
                <h3>India</h3>
                <p>Taj Mahal</p>
            </div>

        </div>

    </div>

    <script>

        document.getElementById("myForm").addEventListener("submit", function (event)
        {
            event.preventDefault();

            let isValid = true;

            let fname = document.getElementById("fname").value.trim();
            let lname = document.getElementById("lname").value.trim();
            let country = document.getElementById("country").value;

            // Clear Errors
            document.getElementById("fnameError").innerHTML = "";
            document.getElementById("lnameError").innerHTML = "";
            document.getElementById("countryError").innerHTML = "";

            // First Name Validation
            if (fname === "")
            {
                document.getElementById("fnameError").innerHTML = "Please enter first name";
                isValid = false;
            }

            // Last Name Validation
            if (lname === "")
            {
                document.getElementById("lnameError").innerHTML = "Please enter last name";
                isValid = false;
            }

            // Country Validation
            if (country === "")
            {
                document.getElementById("countryError").innerHTML = "Please select country";
                isValid = false;
            }

            // Success
            if (isValid)
            {
                document.getElementById("myForm").style.display = "none";
                document.getElementById("successPage").style.display = "block";
            }

        });

    </script>

</body>

</html>
