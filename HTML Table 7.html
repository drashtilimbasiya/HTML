<!DOCTYPE html>
<html>
    <head>
        <title>HTML Table</title>
        <style>
            table, th, td 
            {
                border: 1px solid black;
                border-collapse: collapse; 
                padding: 12px; 
            }
        </style>
    </head>
    <body>
        <table>
            <tr>
                <th rowspan="12" style="text-align: center;">TCB</th>
            </tr>
            <tr>
                <td><b>Order no:</b></td>
                <td colspan="3">#ABC001</td>
            </tr>
            <tr>
                <td><b>Order Date:</b></td>
                <td colspan="3">23-Mar-2016</td>
            </tr>
            <tr>
                <td colspan="4" style="text-align: center;"><b>Customer</b></td>
            </tr>
            <tr>
                <td><b>Name:</b></td>
                <td colspan="3">john papas</td>
            </tr>
            <tr>
                <td><b>Address:</b></td>
                <td colspan="3">independence day 5th str,11511</td>
            </tr>
            <tr>
                <td colspan="4" style="text-align: center;"><b>Order details</b></td>
            </tr>
            <tr>
                <td>1</td>
                <td>of mice and men</td>
                <td>book</td>
                <td>10.00$</td>
            </tr>
            <tr>
                <td>2</td>
                <td>les miserables</td>
                <td>book</td>
                <td>12.00$</td>
            </tr>
            <tr>
                <td>3</td>
                <td>game of thrones-SO1</td>
                <td>DVD</td>
                <td>50.00$</td>
            </tr>
            <tr>
                <td>4</td>
                <td>samsung galaxy</td>
                <td>Mobile Phone</td>
                <td>200.00$</td>
            </tr>
            <tr>
                <td colspan="3" style="text-align: right;"><b>Total:</b></td>
                <td>272.00$</td>
            </tr>
        </table>
    </body>
</html>
