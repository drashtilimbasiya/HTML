<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#222;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.icons{
    display:flex;
    gap:25px;
    font-size:22px;
}

.count{
    background:red;
    color:white;
    border-radius:50%;
    padding:2px 8px;
    font-size:14px;
}

.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    border-radius:10px;
    padding:15px;
    text-align:center;
    position:relative;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.card img{
    width:170px;
    height:170px;
    object-fit:cover;
}

.price{
    font-size:20px;
    color:green;
    margin:10px 0;
}

button{
    cursor:pointer;
}

.cartBtn{
    background:#007bff;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:5px;
}

.qtyBox{
    display:none;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.qtyBox button{
    width:35px;
    height:35px;
    border:none;
    background:#007bff;
    color:white;
    font-size:20px;
    border-radius:5px;
}

.heart{
    position:absolute;
    top:10px;
    right:15px;
    font-size:28px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>

<div class="logo">My Shop</div>

<div class="icons">

<div>
❤️ <span class="count" id="wishCount">0</span>
</div>

<div>
🛒 <span class="count" id="cartCount">0</span>
</div>

</div>

</header>

<div class="container">

<!-- Product 1 -->
<div class="card">
<div class="heart">🤍</div>

<img src="https://via.placeholder.com/170">

<h3>Mobile</h3>

<div class="price">₹20,000</div>

<button class="cartBtn">Add to Cart</button>

<div class="qtyBox">
<button class="minus">-</button>
<span class="qty">1</span>
<button class="plus">+</button>
</div>

</div>

<!-- Product 2 -->
<div class="card">
<div class="heart">🤍</div>

<img src="https://via.placeholder.com/170">

<h3>Laptop</h3>

<div class="price">₹55,000</div>

<button class="cartBtn">Add to Cart</button>

<div class="qtyBox">
<button class="minus">-</button>
<span class="qty">1</span>
<button class="plus">+</button>
</div>

</div>

<!-- Product 3 -->
<div class="card">
<div class="heart">🤍</div>

<img src="https://via.placeholder.com/170">

<h3>Headphone</h3>

<div class="price">₹2,500</div>

<button class="cartBtn">Add to Cart</button>

<div class="qtyBox">
<button class="minus">-</button>
<span class="qty">1</span>
<button class="plus">+</button>
</div>

</div>

<!-- Product 4 -->
<div class="card">
<div class="heart">🤍</div>

<img src="https://via.placeholder.com/170">

<h3>Smart Watch</h3>

<div class="price">₹3,999</div>

<button class="cartBtn">Add to Cart</button>

<div class="qtyBox">
<button class="minus">-</button>
<span class="qty">1</span>
<button class="plus">+</button>
</div>

</div>

</div>

<script>

const cards=document.querySelectorAll(".card");

let cartTotal=0;
let wishTotal=0;

function updateCart(){
document.getElementById("cartCount").innerText=cartTotal;
}

function updateWish(){
document.getElementById("wishCount").innerText=wishTotal;
}

cards.forEach(card=>{

const addBtn=card.querySelector(".cartBtn");
const qtyBox=card.querySelector(".qtyBox");
const qty=card.querySelector(".qty");
const plus=card.querySelector(".plus");
const minus=card.querySelector(".minus");
const heart=card.querySelector(".heart");

let quantity=0;
let liked=false;

addBtn.onclick=function(){

quantity=1;
cartTotal++;
updateCart();

qty.innerText=quantity;

addBtn.style.display="none";
qtyBox.style.display="flex";

}

plus.onclick=function(){

quantity++;
cartTotal++;

qty.innerText=quantity;

updateCart();

}

minus.onclick=function(){

quantity--;
cartTotal--;

updateCart();

if(quantity<=0){

quantity=0;

qtyBox.style.display="none";
addBtn.style.display="inline-block";

}else{

qty.innerText=quantity;

}

}

heart.onclick=function(){

liked=!liked;

if(liked){

heart.innerHTML="❤️";
wishTotal++;

}else{

heart.innerHTML="🤍";
wishTotal--;

}

updateWish();

}

});

</script>

</body>
</html>
