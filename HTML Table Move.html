<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table,th,td{
            border: 1px solid green;
            border-collapse: collapse;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Basic HTML Table</h1>
    <marquee  direction="left">
        <table style="width: 100%">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Limbasiya Drashti</td>
            <td>17</td>
            <td>Surat</td>
        </tr>
        <tr>
            <td>Savaliya Jensi</td>
            <td>20</td>
            <td>Surat</td>
        </tr>
        <tr>
            <td>Gajera Mayuri</td>
            <td>19</td>
            <td>Ahmedabad</td>
        </tr>
    </table>
    </marquee>
    

    
</body>
</html>
